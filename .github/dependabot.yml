version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases that are at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    # Two pins are load-bearing and must not be proposed at all. Dependabot
    # bumped both on the day this config was added, and left the comments
    # explaining the pins sitting three lines above the new numbers - so the
    # file argued with itself and the reasoning was still there to be read.
    #
    # pyarrow: parquet writes `created_by: parquet-cpp-arrow version <x>` into
    # every footer, so a different version rewrites every SHA-256 in
    # MANIFEST.json without one value changing, and `make verify` reports the
    # whole corpus altered. The version is recorded in the manifest.
    #
    # pillow: savitr needs <11 and pdfplumber needs >=12.2, which is why they
    # are separate dependency groups declared as conflicting. Raising pillow
    # breaks the OCR rather than the parse, and it breaks it silently.
    ignore:
      - dependency-name: "pyarrow"
      - dependency-name: "pillow"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    # Two pins are load-bearing and must not be proposed at all. Dependabot
    # bumped both on the day this config was added, and left the comments
    # explaining the pins sitting three lines above the new numbers - so the
    # file argued with itself and the reasoning was still there to be read.
    #
    # pyarrow: parquet writes `created_by: parquet-cpp-arrow version <x>` into
    # every footer, so a different version rewrites every SHA-256 in
    # MANIFEST.json without one value changing, and `make verify` reports the
    # whole corpus altered. The version is recorded in the manifest.
    #
    # pillow: savitr needs <11 and pdfplumber needs >=12.2, which is why they
    # are separate dependency groups declared as conflicting. Raising pillow
    # breaks the OCR rather than the parse, and it breaks it silently.
    ignore:
      - dependency-name: "pyarrow"
      - dependency-name: "pillow"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
